#:schema https://mise.jdx.dev/schema/mise.json
[tools]
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }

# Pre-answer the one-time prompts that nobody can answer in a container:
# onboarding, trust of the workspace and the Remote Control confirmation
[bootstrap.hooks.post-tools]
run = '''
set -e
f="${CLAUDE_CONFIG_DIR:-$HOME}/.claude.json"
mkdir -p "$(dirname "$f")"
[ -s "$f" ] || echo '{}' > "$f"
jq --arg ws "$AGENT_WORKSPACE" '.hasCompletedOnboarding = true
    | .remoteDialogSeen = true
    | .projects[$ws].hasTrustDialogAccepted = true' "$f" > "$f.tmp"
cat "$f.tmp" > "$f"
rm -f "$f.tmp"
'''
