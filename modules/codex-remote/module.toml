#:schema ../../schema/module.schema.json
description = "Codex Remote Control: sessions in the ChatGPT app, listed under the container's host name; pair with `codex-pair`"
requires = ["codex"]
next_steps = ["Pair the ChatGPT app: `codex-pair`, then enter the code in the app"]

# Waits for a Codex login (`agent-run codex login --device-auth`), checking
# every 30 seconds, then runs the server in the foreground (the background
# daemon of `codex remote-control start` is unreliable in containers).
# If the server exits later, e.g. without network, pitchfork would restart it
# at once and keep it busy; the sleep spaces out the retries.
[daemons.codex-remote]
run = '''
codex login status > /dev/null 2>&1 || echo "Waiting for a Codex login: agent-run codex login --device-auth"
until codex login status > /dev/null 2>&1; do sleep 30; done
codex remote-control --no-daemon \
    || { echo "codex remote-control exited, retrying in 30s"; sleep 30; exit 1; }
'''
retry = true
