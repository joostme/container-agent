#:schema https://mise.jdx.dev/schema/mise.json
[bootstrap.packages]
"apt:openssh-server" = "latest"

# Runs as root. The host keys live in the home volume, so clients do not see a
# new host key after the container is recreated. Login works with the keys in
# ~/.ssh/authorized_keys (e.g. from the read-only mount at ~/.ssh-keys).
[bootstrap.hooks.post-packages]
run = '''
set -e
keys="$AGENT_HOME/.local/state/container-agent/sshd"
mkdir -p "$keys" /run/sshd
[ -f "$keys/ssh_host_ed25519_key" ] || ssh-keygen -q -t ed25519 -N '' -f "$keys/ssh_host_ed25519_key"
cat > /etc/ssh/sshd_config.d/container-agent.conf <<EOF
Port $SSH_PORT
HostKey $keys/ssh_host_ed25519_key
AllowUsers $AGENT_USER
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
PrintMotd no
EOF
'''
