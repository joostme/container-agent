#:schema ../../schema/module.schema.json
description = "T3 Code server for the T3 web, desktop and mobile apps; drives Claude, Codex, OpenCode and more"
after = ["claude", "codex", "opencode"]
next_steps = ["Pair the T3 app or a browser: `t3-pair` (set T3_PUBLIC_URL or T3_PUBLIC_HOST first, so the link works from other devices)"]

[env.T3_PORT]
description = "Port of the T3 server"
default = "3773"
port = "http"

[env.T3_PUBLIC_URL]
description = "URL of a reverse proxy in front of the server (e.g. https://t3.example.org), used by t3-pair for pairing links"

[env.T3_PUBLIC_HOST]
description = "LAN IP or host name of the Docker host, used by t3-pair when T3_PUBLIC_URL is not set"

[env.T3_PUBLIC_PORT]
description = "Published host port for T3_PUBLIC_HOST, if it differs from T3_PORT"

[daemons.t3]
run = 'exec t3 serve --host 0.0.0.0 --port "$T3_PORT" --no-browser'
retry = true
ready_cmd = 'curl -s -o /dev/null "http://127.0.0.1:$T3_PORT/"'
