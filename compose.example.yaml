# Example: Claude Code Remote Control and T3 Code, with VS Code in the browser.
# Copy to compose.yaml, adjust AGENT_MODULES and the ports of the modules.
services:
  agent:
    image: ghcr.io/joostme/container-agent:latest
    container_name: agent
    hostname: agent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - AGENT_MODULES=${AGENT_MODULES:-gh,code-server,claude-remote,t3}
      - AUTO_UPDATE=${AUTO_UPDATE:-true}
      # Module settings; see `docker compose exec agent container-agent plan`
      - CODE_SERVER_PASSWORD
      - CLAUDE_REMOTE_NAME
      - T3_PUBLIC_URL
      - T3_PUBLIC_HOST
      - GH_TOKEN
    volumes:
      # The whole home: logins, mise tools, caches and module state
      - ./data/home:/home/agent
      - ./data/repos:/repos
      # SSH keys for git (read-only, copied into ~/.ssh on start)
      - ${SSH_KEY_PATH:-~/.ssh}:/home/agent/.ssh-keys:ro
    ports:
      - "8080:8080" # code-server
      - "3773:3773" # T3 Code
