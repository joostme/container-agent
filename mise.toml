# Development tools for this repository (not part of the image)
[tools]
# the configurator in web/
node = "24"
pitchfork = "2.32.3"
yq = "4.54.1"
# Unlike taplo, tombi supports unevaluatedProperties, which the module schema
# needs to flag unknown daemon options
tombi = "1.9.7"
shellcheck = "latest"

[tasks.lint]
description = "Check the shell scripts, the TOML files against their schemas and the pinned versions"
run = [
    "shellcheck image/container-agent image/agent-run modules/*/bin/* scripts/* tests/run",
    "tombi lint image/mise.toml modules/*/*.toml",
    "scripts/check-versions",
]

[tasks.test]
description = "Test module resolution and the generated pitchfork config"
run = "tests/run"
