name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - run: mise run lint
      - run: mise run test

  # Starts the image with modules that need no login, from a catalog built
  # from this ref, and waits until the container reports healthy, i.e. setup
  # ran and all daemons are up
  smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # yq for building the catalog
      - uses: jdx/mise-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: container-agent:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configuration
        run: |
          scripts/build-catalog smoke/catalog
          mkdir -p smoke/config
          cat > smoke/config/agent.toml <<'EOF'
          format = 1
          catalog = "/catalog"

          [modules]
          code-server = "latest"
          sshd = "latest"
          oh-my-zsh = "latest"
          gh = "latest"
          t3 = "latest"
          codex = "latest"
          EOF
      - name: Start container
        run: |
          docker run -d --name smoke \
            -v "${PWD}/smoke/config:/etc/container-agent:ro" \
            -v "${PWD}/smoke/catalog:/catalog:ro" \
            -e CODE_SERVER_PASSWORD=smoke \
            container-agent:smoke
      - name: Wait for healthy
        run: |
          for _ in $(seq 1 120); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || echo gone)
            echo "health: ${status}"
            case "${status}" in
              healthy) exit 0 ;;
              unhealthy|gone) break ;;
            esac
            sleep 10
          done
          exit 1
      - name: Check daemons and tools
        run: |
          docker exec smoke agent-run pitchfork list
          for tool in code-server gh t3 codex; do docker exec smoke agent-run which "${tool}"; done
          docker exec smoke agent-run grep -q '^sandbox_mode = "danger-full-access"' /home/agent/.codex/config.toml
          # module tasks become commands
          for tool in qrencode t3-pair; do docker exec smoke which "${tool}"; done
          docker exec smoke t3-pair --help
          # the catalog cache in the home belongs to the agent
          test "$(docker exec smoke stat -c %U /home/agent/.cache/container-agent/catalog/t3)" = agent
          docker exec smoke agent-run test -d /home/agent/.oh-my-zsh
          docker exec smoke agent-run curl -sf -o /dev/null http://127.0.0.1:8080/healthz
          # module packages come without recommends (xauth is one of openssh-server)
          if docker exec smoke dpkg -s xauth > /dev/null 2>&1; then
            echo "apt installed recommended packages" >&2
            exit 1
          fi
      - name: Logs
        if: always()
        run: |
          docker logs smoke || true
          docker exec smoke agent-run pitchfork logs -n 100 || true

  publish:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a v* tag, after the image is out: a GitHub release with generated
  # notes. The catalog and the configurator are released on their own, see
  # pages.yml.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
