name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - run: mise run lint
      - run: mise run test

  # The configurator, built for the image version of this ref: the tag without
  # its v for releases, latest otherwise
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # node, and yq for the test that compares with the entrypoint
      - uses: jdx/mise-action@v3
      - name: Image version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=latest; fi
          echo "IMAGE_VERSION=${version}" >> "${GITHUB_ENV}"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: |
          npm run build
          cp src/lib/registry.json build/registry.json
      - uses: actions/upload-artifact@v7
        with:
          name: configurator
          path: web/build

  # Starts the image with modules that need no login and waits until the
  # container reports healthy, i.e. setup ran and all daemons are up
  smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: container-agent:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name smoke \
            -e AGENT_MODULES=code-server,sshd,oh-my-zsh,gh,t3,codex \
            -e CODE_SERVER_PASSWORD=smoke \
            container-agent:smoke
      - name: Wait for healthy
        run: |
          for _ in $(seq 1 120); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || echo gone)
            echo "health: ${status}"
            case "${status}" in
              healthy) exit 0 ;;
              unhealthy|gone) break ;;
            esac
            sleep 10
          done
          exit 1
      - name: Check daemons and tools
        run: |
          docker exec smoke agent-run pitchfork list
          for tool in code-server gh t3 codex; do docker exec smoke agent-run which "${tool}"; done
          docker exec smoke agent-run grep -q '^sandbox_mode = "danger-full-access"' /home/agent/.codex/config.toml
          for tool in qrencode t3-pair; do docker exec smoke which "${tool}"; done
          docker exec smoke agent-run test -d /home/agent/.oh-my-zsh
          docker exec smoke agent-run curl -sf -o /dev/null http://127.0.0.1:8080/healthz
          # module packages come without recommends (xauth is one of openssh-server)
          if docker exec smoke dpkg -s xauth > /dev/null 2>&1; then
            echo "apt installed recommended packages" >&2
            exit 1
          fi
      - name: Logs
        if: always()
        run: |
          docker logs smoke || true
          docker exec smoke agent-run pitchfork logs -n 100 || true

  publish:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a v* tag, after the image is out: a GitHub release with the module
  # registry and the configurator of that version
  release:
    needs: [publish, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: configurator
          path: configurator
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp configurator/registry.json registry.json
          tar -czf configurator.tar.gz -C configurator .
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            registry.json configurator.tar.gz

  # On a v* tag, after the image is out: the configurator of that version on
  # GitHub Pages (Settings -> Pages -> Source: GitHub Actions)
  pages:
    needs: [publish, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: configurator
          path: configurator
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: configurator
      - id: deploy
        uses: actions/deploy-pages@v5
