name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - run: mise run lint
      - run: mise run test

  # Starts the image with modules that need no login, from a catalog built
  # from this ref, and waits until the container reports healthy, i.e. setup
  # ran and all daemons are up
  smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fitout:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configuration
        run: |
          mkdir -p smoke/config
          cat > smoke/config/fitout.toml <<'EOF'
          format = 1
          catalog = "/catalog"
          modules = ["code-server", "sshd", "oh-my-zsh", "devtools", "gh", "t3", "codex"]
          EOF
      - name: Start container
        run: |
          docker run -d --name smoke \
            -v "${PWD}/smoke/config:/etc/fitout:ro" \
            -v "${PWD}/catalog:/catalog:ro" \
            -e CODE_SERVER_PASSWORD=smoke \
            fitout:smoke
      - name: Wait for healthy
        run: |
          for _ in $(seq 1 120); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || echo gone)
            echo "health: ${status}"
            case "${status}" in
              healthy) exit 0 ;;
              unhealthy|gone) break ;;
            esac
            sleep 10
          done
          exit 1
      - name: Check daemons and tools
        run: |
          docker exec smoke fitout run pitchfork list
          for tool in code-server gh t3 codex git rg make; do docker exec smoke fitout run which "${tool}"; done
          docker exec smoke fitout run grep -q '^sandbox_mode = "danger-full-access"' /home/fitout/.codex/config.toml
          # module tasks become commands
          for tool in qrencode t3-pair; do docker exec smoke which "${tool}"; done
          docker exec smoke t3-pair --help
          # the catalog cache in the home belongs to the user
          test "$(docker exec smoke stat -c %U /home/fitout/.cache/fitout/catalog/t3.toml)" = fitout
          # zsh (through oh-my-zsh) is the login shell and finds the mise tools
          test "$(docker exec smoke getent passwd fitout | cut -d: -f7)" = /usr/bin/zsh
          docker exec smoke fitout run zsh -c 'which t3'
          docker exec smoke fitout run test -d /home/fitout/.oh-my-zsh
          docker exec smoke fitout run git config --global --get safe.directory
          docker exec smoke fitout run curl -sf -o /dev/null http://127.0.0.1:8080/healthz
          # the base image itself stays plain: git and zsh came from modules
          docker run --rm --entrypoint sh fitout:smoke -c '! command -v git && ! command -v zsh'
          # module packages come without recommends (xauth is one of openssh-server)
          if docker exec smoke dpkg -s xauth > /dev/null 2>&1; then
            echo "apt installed recommended packages" >&2
            exit 1
          fi
      - name: Logs
        if: always()
        run: |
          docker logs smoke || true
          docker exec smoke fitout run pitchfork logs -n 100 || true

  publish:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a v* tag, after the image is out: a GitHub release with generated
  # notes. Containers read the catalog from the repository; the configurator
  # deploys from pages.yml.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
