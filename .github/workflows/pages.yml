name: Configurator

# Checks the catalog and deploys the configurator, with the catalog of the
# commit built in, on every push to main. The image reads the catalog straight
# from the repository. Pages has to be enabled once under Settings -> Pages ->
# Source: GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - run: scripts/check-catalog
      - name: Configurator
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
