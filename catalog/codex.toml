#:schema ../schema/v1/module.schema.json
format = 1
name = "codex"
description = "OpenAI Codex CLI, e.g. as a provider in T3 Code"
version = "1.0.0"
tags = ["agent", "openai"]
next_steps = ["Log in once: `agent-run codex login --device-auth`"]

[env.CODEX_HOME]
type = "path"
description = "Directory of the Codex config, login and sessions. Unset: ~/.codex."

[mise.tools]
codex = "latest"

# The container already isolates Codex, and its own sandbox (bubblewrap)
# cannot create namespaces in an unprivileged container. Only added when the
# Codex config sets no sandbox_mode of its own.
[mise.bootstrap.hooks.post-tools]
run = '''
set -e
f="${CODEX_HOME:-$HOME/.codex}/config.toml"
mkdir -p "$(dirname "$f")"
touch "$f"
if ! grep -Eq '^[[:space:]]*sandbox_mode[[:space:]]*=' "$f"; then
    { printf '# Added by container-agent: the container is the sandbox\nsandbox_mode = "danger-full-access"\n\n'
      cat "$f"; } > "$f.tmp"
    mv "$f.tmp" "$f"
fi
'''
