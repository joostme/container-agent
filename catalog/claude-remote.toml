#:schema ../schema/v1/module.schema.json
format = 1
name = "claude-remote"
description = "Claude Code Remote Control: sessions in claude.ai/code and the Claude apps"
version = "1.0.0"
tags = ["remote control", "anthropic"]
requires = ["claude"]
next_steps = ["After the login the container shows up in claude.ai/code and the Claude apps under CLAUDE_REMOTE_NAME"]

[env.CLAUDE_REMOTE_NAME]
default = "fitout"
description = "Name in the session list of claude.ai/code and the apps"

[env.CLAUDE_REMOTE_SPAWN]
type = "choice"
choices = ["same-dir", "worktree"]
default = "same-dir"
description = "Where new sessions run"

[env.CLAUDE_REMOTE_PERMISSION_MODE]
type = "choice"
choices = ["auto", "default", "acceptEdits", "plan"]
default = "auto"
description = "Permission mode of new sessions"

# Finishes once Claude is logged in (`fitout run claude`, then /login)
[daemons.claude-remote-login]
run = '''
claude auth status > /dev/null 2>&1 || echo "Waiting for a Claude login: fitout run claude, then /login"
until claude auth status > /dev/null 2>&1; do sleep 30; done
'''
oneshot = true

# pitchfork restarts a failed daemon at once; the sleep spaces out the retries
[daemons.claude-remote]
run = '''
claude remote-control --name "$CLAUDE_REMOTE_NAME" --spawn "$CLAUDE_REMOTE_SPAWN" \
    --permission-mode "$CLAUDE_REMOTE_PERMISSION_MODE" \
    || { echo "claude remote-control exited, retrying in 30s"; sleep 30; exit 1; }
'''
depends = ["claude-remote-login"]
retry = true
# its status view redraws all the time; keep the log small
line_retention = 2000
