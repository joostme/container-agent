#:schema ../schema/v1/module.schema.json
format = 1
name = "oh-my-zsh"
description = "Oh My Zsh for the zsh of the user"
version = "1.0.0"
tags = ["shell"]
requires = ["zsh", "git"]

# Installs once into ~/.oh-my-zsh and adds it to ~/.zshrc; edit the theme and
# plugins there.
[mise.bootstrap.hooks.post-tools]
run = '''
set -e
dir="$HOME/.oh-my-zsh"
[ -d "$dir/.git" ] || git clone -q --depth 1 https://github.com/ohmyzsh/ohmyzsh.git "$dir"
grep -Fq '# fitout oh-my-zsh' "$HOME/.zshrc" 2>/dev/null || cat >> "$HOME/.zshrc" <<'EOF'

# fitout oh-my-zsh
export ZSH="$HOME/.oh-my-zsh"
ZSH_THEME="robbyrussell"
plugins=(git)
DISABLE_AUTO_UPDATE="true"
source "$ZSH/oh-my-zsh.sh"
EOF
'''
