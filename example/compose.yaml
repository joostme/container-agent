# Example: a coding box with Claude Code Remote Control, T3 Code and VS Code
# in the browser. Copy this folder, set the modules and values in
# config/fitout.toml and the secrets in .env (from .env.example). Publish the
# ports of your modules.
services:
  box:
    image: ghcr.io/joostme/fitout:latest
    hostname: box
    restart: unless-stopped
    env_file: .env
    environment:
      # owner of ./data on the host (run `id`)
      PUID: 1000
      PGID: 1000
    volumes:
      # fitout.toml and custom modules; read on every start
      - ./config:/etc/fitout:ro
      # the whole home: logins, mise tools, caches and module state
      - ./data/home:/home/fitout
      - ./data/workspace:/workspace
      # SSH keys for git (read-only; the ssh module copies them into ~/.ssh)
      - ~/.ssh:/home/fitout/.ssh-keys:ro
    ports:
      - "8080:8080" # code-server
      - "3773:3773" # T3 Code
